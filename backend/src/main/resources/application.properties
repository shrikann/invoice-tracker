spring.application.name=invoice-tracker-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/invoice_tracker}
spring.datasource.username=${DB_USERNAME:invoice_user}
spring.datasource.password=${DB_PASSWORD:invoice_dev_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

spring.config.import=optional:file:../.env[.properties]

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=30
